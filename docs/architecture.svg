<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Writing-Zero first-pass research pipeline architecture</title>
  <desc id="desc">A left to right diagram showing prompts, rubrics, pairwise sample generation, mock GenRM scoring, evaluation, compute handoff, memory learning loop, deduplication, and self-update gate.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
      .green-card { fill: #fbfefb; stroke: #15803d; stroke-width: 2; rx: 12; }
      .loop { fill: #f7fff8; stroke: #166534; stroke-width: 2; rx: 18; }
      .title { fill: #0f172a; font: 700 44px Arial, sans-serif; letter-spacing: .5px; }
      .subtitle { fill: #2563eb; font: 700 18px Arial, sans-serif; letter-spacing: 7px; }
      .label { fill: #0f172a; font: 700 17px Arial, sans-serif; }
      .small { fill: #334155; font: 400 13px Arial, sans-serif; }
      .tiny { fill: #475569; font: 400 11px Arial, sans-serif; }
      .arrow { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke: #15803d; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-green); }
      .icon { fill: none; stroke: #1d4ed8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-green { fill: none; stroke: #15803d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .pill { fill: #ffffff; stroke: #15803d; stroke-width: 1.6; rx: 10; }
      .stage { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.6; rx: 9; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="760"/>
  <text class="title" x="720" y="66" text-anchor="middle">Writing-Zero First Pass</text>
  <text class="subtitle" x="720" y="104" text-anchor="middle">AI RESEARCH PIPELINE</text>

  <g transform="translate(34 198)">
