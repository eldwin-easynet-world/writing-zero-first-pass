    <text class="label" x="69" y="138" text-anchor="middle">PUBLIC</text>
    <text class="label" x="69" y="160" text-anchor="middle">PROMPTS</text>
    <path d="M30 188h78" stroke="#93c5fd" stroke-width="2"/>
    <text class="small" x="69" y="220" text-anchor="middle">Curated prompts</text>
    <text class="small" x="69" y="239" text-anchor="middle">from public</text>
    <text class="small" x="69" y="258" text-anchor="middle">sources</text>
  </g>

