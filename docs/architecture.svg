    <text class="label" x="69" y="138" text-anchor="middle">MOCK GENRM</text>
    <text class="label" x="69" y="160" text-anchor="middle">SCORER</text>
    <path d="M30 188h78" stroke="#93c5fd" stroke-width="2"/>
    <path class="icon" d="M31 282a42 42 0 0 1 76 0"/>
    <path class="icon" d="M69 282l23-28"/>
