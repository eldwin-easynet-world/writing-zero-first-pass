    <path class="icon" d="M50 34h46l18 18v52H50zM96 34v20h18"/>
    <path class="icon" d="M62 80h36M62 94h25"/>
    <text class="label" x="69" y="138" text-anchor="middle">EVALUATION</text>
    <text class="label" x="69" y="160" text-anchor="middle">ARTIFACT</text>
    <path d="M30 188h78" stroke="#93c5fd" stroke-width="2"/>
    <text class="small" x="69" y="226" text-anchor="middle">Scores, metadata,</text>
    <text class="small" x="69" y="245" text-anchor="middle">and validation</text>
    <text class="small" x="69" y="264" text-anchor="middle">result</text>
  </g>

  <g transform="translate(932 198)">
    <rect class="green-card" width="146" height="324"/>
    <path class="icon-green" d="M73 32l38 18v35c0 26-17 43-38 51-21-8-38-25-38-51V50z"/>
    <path class="icon-green" d="M57 84l12 12 25-34"/>
