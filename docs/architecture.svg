    </g>
    <g transform="translate(38 244)">
      <rect class="pill" width="142" height="46"/>
      <text class="label" x="71" y="29" text-anchor="middle">SKILL</text>
    </g>
    <g transform="translate(38 304)">
      <rect class="pill" width="142" height="46"/>
      <text class="label" x="71" y="29" text-anchor="middle">AGENT</text>
