    <text class="label" x="138" y="38" text-anchor="middle" fill="#14532d">MEMORY LEARNING LOOP</text>
    <g transform="translate(38 64)">
      <rect class="pill" width="142" height="46"/>
      <text class="label" x="71" y="29" text-anchor="middle">FACT</text>
    </g>
    <g transform="translate(38 124)">
